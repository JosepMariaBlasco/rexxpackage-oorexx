name: Rexx/SQL (Linux)

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  # The ooRexx revision of the user's family of ooRexx projects.
  OOREXX_REV: "13312"

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install ooRexx r${{ env.OOREXX_REV }}
        run: |
          curl -fsSL -o /tmp/oorexx.deb \
            "https://downloads.sourceforge.net/project/oorexx/oorexx/5.3.0beta/oorexx-5.3.0-${OOREXX_REV}.ubuntu2404.x86_64.deb"
          file /tmp/oorexx.deb | grep -q 'Debian binary package'
          sudo dpkg -i /tmp/oorexx.deb
          sudo ldconfig
          rexx -v

      - name: Install SQLite 3 development files
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - name: Build
        run: rexxsql/build.sh build/rexxsql

      - name: Smoke test
        working-directory: build
        run: LD_LIBRARY_PATH="$PWD/rexxsql/src" rexx ../rexxsql/test/smoke.rex

      - uses: actions/upload-artifact@v4
        with:
          name: rexxsql-2.6B3-oorexx-r${{ env.OOREXX_REV }}-linux-x86_64
          path: |
            build/rexxsql/src/librexxsql.so
            build/rexxsql/src/rexxsql
            rexxsql/LICENSE
